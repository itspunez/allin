name: Discover public sources
on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"
permissions:
  contents: write
concurrency:
  group: source-discovery
  cancel-in-progress: true
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Discover
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m src.discover
      - name: Commit registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/discovered_sources.json
          git diff --cached --quiet || git commit -m "chore: refresh discovered sources"
          git push
